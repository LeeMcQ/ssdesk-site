<h1>Sabbath Service Desk</h1>
<p>A free offline church presenter for Seventh-day Adventist media teams: Bible, hymns with music, slides, video, banners and a stage screen. It installs from your browser and works with no internet. Turn JavaScript on to use it.</p>
<p>Made by Lee McQuire of WiFi vs The Word Ministries. Independent, and not an official Seventh-day Adventist Church product.</p>
<p><a href="about.html">What it does and how to start</a> · <a href="afrikaans.html">In Afrikaans</a> · <a href="guide-offline-church-service.html">Run a service with no internet</a> · <a href="guide-hymns-with-music.html">Hymns with music on the projector</a> · <a href="guide-stage-screen-and-phone-remote.html">Stage screen and phone remote</a></p>
<p><a href="companion.html">Companion download</a> · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></p>
</noscript>
